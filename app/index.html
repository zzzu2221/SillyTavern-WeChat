<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>酒馆微信</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- 页面容器 -->
  <div id="pages">
    <!-- 微信（会话列表） -->
    <div class="page" id="page-chatlist">
      <header class="page-header">
        <div class="header-title">微信</div>
        <div class="header-actions">
          <button class="icon-btn" id="btn-chatlist-add" title="发起会话">＋</button>
        </div>
      </header>
      <div class="page-body" id="chatlist-body"></div>
    </div>

    <!-- 通讯录 -->
    <div class="page" id="page-contacts">
      <header class="page-header">
        <div class="header-title">通讯录</div>
        <div class="header-actions">
          <button class="icon-btn" id="btn-contacts-add" title="新朋友">＋</button>
        </div>
      </header>
      <div class="page-body" id="contacts-body"></div>
    </div>

    <!-- 朋友圈 -->
    <div class="page" id="page-moments">
      <header class="page-header moments-header">
        <div class="header-title" id="moments-title-label">朋友圈</div>
        <div class="header-actions">
          <button class="icon-btn" id="btn-moments-ai" title="AI 自动发圈">🤖</button>
          <button class="icon-btn" id="btn-moments-add" title="发布">📷</button>
        </div>
      </header>
      <div class="page-body" id="moments-body"></div>
    </div>

    <!-- 朋友圈单条详情（从转发卡片进入，仿微信单条详情） -->
    <div class="page page-full" id="page-moment-detail" style="display:none">
      <header class="page-header">
        <button class="icon-btn" id="btn-moment-detail-back">‹</button>
        <div class="header-title">朋友圈</div>
        <div class="header-actions"></div>
      </header>
      <div class="page-body" id="moment-detail-body"></div>
    </div>

    <!-- 公众号 -->
    <div class="page" id="page-articles" style="display:none">
      <header class="page-header">
        <div class="header-title">公众号</div>
        <div class="header-actions">
          <button class="icon-btn" id="btn-article-add" title="AI 写推文">🤖</button>
        </div>
      </header>
      <div class="page-body" id="articles-body"></div>
    </div>

    <!-- 我 -->
    <div class="page" id="page-me">
      <header class="page-header">
        <div class="header-title">我</div>
      </header>
      <div class="page-body" id="me-body"></div>
    </div>

    <!-- 聊天页 -->
    <div class="page page-full" id="page-chat" style="display:none">
      <header class="page-header chat-header">
        <button class="icon-btn" id="btn-chat-back">‹</button>
        <div class="header-title chat-title" id="chat-title">对话</div>
        <div class="header-actions">
          <button class="icon-btn" id="btn-chat-detail" title="角色详情">⋯</button>
        </div>
      </header>
      <div class="page-body chat-body" id="chat-body"></div>
      <div class="chat-input-bar">
        <button class="emoji-btn" id="btn-emoji" title="表情">😊</button>
        <div class="emoji-panel" id="emoji-panel"></div>
        <textarea id="chat-input" rows="1" placeholder="发消息…" enterkeyhint="send"></textarea>
        <button id="chat-send" class="send-btn">发送</button>
      </div>
    </div>

    <!-- 角色详情页 -->
    <div class="page page-full" id="page-detail" style="display:none">
      <header class="page-header">
        <button class="icon-btn" id="btn-detail-back">‹</button>
        <div class="header-title" id="detail-title">角色详情</div>
        <div class="header-actions"></div>
      </header>
      <div class="page-body" id="detail-body"></div>
    </div>

    <!-- 会话列表页（某角色全部历史会话） -->
    <div class="page page-full" id="page-sessions" style="display:none">
      <header class="page-header">
        <button class="icon-btn" id="btn-sessions-back">‹</button>
        <div class="header-title" id="sessions-title">历史会话</div>
        <div class="header-actions">
          <button class="icon-btn" id="btn-sessions-new">＋</button>
        </div>
      </header>
      <div class="page-body" id="sessions-body"></div>
    </div>

    <!-- 新朋友页（通讯录＋入口） -->
    <div class="page page-full" id="page-friends" style="display:none">
      <header class="page-header">
        <button class="icon-btn" id="btn-friends-back">‹</button>
        <div class="header-title">新朋友</div>
        <div class="header-actions"></div>
      </header>
      <div class="page-body" id="friends-body"></div>
    </div>

    <!-- 账号管理页（我页入口） -->
    <div class="page page-full" id="page-account" style="display:none">
      <header class="page-header">
        <button class="icon-btn" id="btn-account-back">‹</button>
        <div class="header-title">账号管理</div>
        <div class="header-actions">
          <button class="icon-btn" id="btn-account-add" title="新建账号">＋</button>
        </div>
      </header>
      <div class="page-body" id="account-body"></div>
    </div>

    <!-- 公众号阅读页 -->
    <div class="page page-full" id="page-article-read" style="display:none">
      <header class="page-header">
        <button class="icon-btn" id="btn-article-back">‹</button>
        <div class="header-title" id="article-read-title">推文</div>
        <div class="header-actions">
          <button class="icon-btn" id="btn-article-share" title="分享到私信">↗</button>
          <button class="icon-btn" id="btn-article-del" title="删除">✕</button>
        </div>
      </header>
      <div class="page-body article-read-body" id="article-read-body"></div>
    </div>
  </div>

  <!-- 底部 Tab -->
  <nav class="tabbar" id="tabbar">
    <div class="tab-item" data-tab="chatlist"><span class="tab-icon">💬</span><span class="tab-label">微信</span></div>
    <div class="tab-item" data-tab="contacts"><span class="tab-icon">👥</span><span class="tab-label">通讯录</span></div>
    <div class="tab-item" data-tab="moments"><span class="tab-icon">🌐</span><span class="tab-label">朋友圈</span></div>
    <div class="tab-item" id="tab-articles" data-tab="articles"><span class="tab-icon">📰</span><span class="tab-label">公众号</span></div>
    <div class="tab-item" data-tab="me"><span class="tab-icon">👤</span><span class="tab-label">我</span></div>
  </nav>

  <!-- 发布朋友圈弹层 -->
  <div class="modal-mask" id="moment-modal" style="display:none">
    <div class="modal-card">
      <div class="modal-title">发布朋友圈</div>
      <div class="modal-field" id="moment-char-field">
        <label>参考角色（AI 草稿依据哪个角色的聊天）</label>
        <select id="moment-char"></select>
      </div>
      <div class="modal-field">
        <label>文案</label>
        <textarea id="moment-text" placeholder="这一刻的想法…" rows="3"></textarea>
      </div>
      <div class="modal-field">
        <label>配图方式</label>
        <div class="seg" id="moment-imgmode">
          <button type="button" class="seg-btn active" data-mode="none">无图</button>
          <button type="button" class="seg-btn" data-mode="gen">生图</button>
          <button type="button" class="seg-btn" data-mode="upload">上传图片</button>
        </div>
      </div>
      <div class="modal-field" id="moment-preset-field" style="display:none">
        <label>生图预设</label>
        <select id="moment-preset"><option value="">无</option></select>
      </div>
      <div class="modal-field" id="moment-imgprompt-field" style="display:none">
        <label>生图提示词</label>
        <textarea id="moment-imgprompt" placeholder="例如：1girl, cherry blossoms, sunset, cinematic lighting" rows="2"></textarea>
      </div>
      <div class="modal-field" id="moment-upload-field" style="display:none">
        <label>选择图片</label>
        <div class="upload-pick">
          <button type="button" class="btn-plain" id="moment-upload-btn">＋ 选择图片</button>
          <input type="file" id="moment-file" accept="image/*" style="display:none">
          <img id="moment-file-preview" class="upload-preview" style="display:none">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-plain" id="moment-cancel">取消</button>
        <button class="btn-plain" id="moment-ai-draft">✨ AI 生成草稿</button>
        <button class="btn-primary" id="moment-submit">发布</button>
      </div>
      <div class="modal-tip" id="moment-tip"></div>
    </div>
  </div>

  <!-- 评论输入弹层 -->
  <div class="modal-mask" id="comment-modal" style="display:none">
    <div class="modal-card">
      <div class="modal-title">评论这条朋友圈</div>
      <div class="modal-field">
        <label>由谁评论</label>
        <div class="seg" id="comment-who">
          <button type="button" class="seg-btn active" data-who="char">角色</button>
          <button type="button" class="seg-btn" data-who="me">我</button>
        </div>
      </div>
      <div class="modal-field" id="comment-char-field">
        <label>选择角色</label>
        <select id="comment-char"></select>
      </div>
      <div class="modal-field">
        <label>评论内容</label>
        <textarea id="comment-text" rows="2" placeholder="写点评论…"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-plain" id="comment-ai">✨ AI评论</button>
        <button class="btn-plain" id="comment-cancel">取消</button>
        <button class="btn-primary" id="comment-submit">发送</button>
      </div>
      <div class="modal-tip" id="comment-tip"></div>
    </div>
  </div>

  <!-- AI 自动发圈弹层 -->
  <div class="modal-mask" id="ai-moment-modal" style="display:none">
    <div class="modal-card">
      <div class="modal-title">🤖 AI 自动发朋友圈</div>
      <div class="modal-field">
        <label>发布角色（仅通讯录内角色可选）</label>
        <select id="aim-char"></select>
      </div>
      <div class="modal-field">
        <label>补充灵感（可选，留空则 AI 依据最近聊天）</label>
        <textarea id="aim-hint" rows="2" placeholder="例如：今天发生了什么？想炫耀/吐槽什么？"></textarea>
      </div>
      <div class="modal-field">
        <label>AI 生成的文案（可修改）</label>
        <textarea id="aim-text" rows="3" placeholder="点击「✨ 生成」后由 AI 自动填写"></textarea>
      </div>
      <div class="modal-field">
        <label>配图方式</label>
        <div class="seg" id="aim-imgmode">
          <button type="button" class="seg-btn active" data-mode="none">无图</button>
          <button type="button" class="seg-btn" data-mode="gen">AI 生图</button>
          <button type="button" class="seg-btn" data-mode="upload">上传图片</button>
        </div>
      </div>
      <div class="modal-field" id="aim-preset-field" style="display:none">
        <label>生图预设（可选）</label>
        <select id="aim-preset"><option value="">无</option></select>
      </div>
      <div class="modal-field" id="aim-img-field" style="display:none">
        <label>配图生图提示词（可修改，留空则不带图）</label>
        <textarea id="aim-img" rows="2" placeholder="由 AI 自动生成"></textarea>
      </div>
      <div class="modal-field" id="aim-upload-field" style="display:none">
        <label>选择图片（人工编辑用）</label>
        <div class="upload-pick">
          <button type="button" class="btn-plain" id="aim-upload-btn">＋ 选择图片</button>
          <input type="file" id="aim-file" accept="image/*" style="display:none">
          <img id="aim-file-preview" class="upload-preview" style="display:none">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-plain" id="aim-cancel">取消</button>
        <button class="btn-plain" id="aim-gen">✨ 生成草稿</button>
        <button class="btn-primary" id="aim-publish">📤 发布</button>
      </div>
      <div class="modal-tip" id="aim-tip"></div>
    </div>
  </div>

  <!-- 个人信息编辑弹层（我页） -->
  <div class="modal-mask" id="profile-modal" style="display:none">
    <div class="modal-card">
      <div class="modal-title" id="profile-modal-title">个人信息</div>
      <div class="modal-field">
        <label>头像</label>
        <div class="profile-avatar-pick" id="profile-avatar-pick"></div>
        <div class="upload-pick">
          <button type="button" class="btn-plain" id="profile-avatar-upload-btn">＋ 本地上传头像</button>
          <input type="file" id="profile-avatar-file" accept="image/*" style="display:none">
        </div>
      </div>
      <div class="modal-field"><label>名字</label><input id="profile-name" placeholder="我的名字"></div>
      <div class="modal-field"><label>微信号</label><input id="profile-id" placeholder="wxid 或自定义"></div>
      <div class="modal-field"><label>个性签名</label><input id="profile-sig" placeholder="个性签名"></div>
      <div class="modal-field"><label>人设描述（AI 帮你发朋友圈时参考的「你」的设定）</label>
        <textarea id="profile-desc" rows="3" placeholder="例如：刚入高专的新生，嘴硬心软，喜欢吐槽身边人…"></textarea>
      </div>
      <div class="modal-field"><label>朋友圈封面</label>
        <input id="profile-cover" placeholder="图片地址，或下方本地上传">
        <div class="upload-pick">
          <button type="button" class="btn-plain" id="profile-cover-upload-btn">＋ 本地上传封面</button>
          <input type="file" id="profile-cover-file" accept="image/*" style="display:none">
          <img id="profile-cover-preview" class="upload-preview upload-preview-cover" style="display:none">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-plain" id="profile-cancel">取消</button>
        <button class="btn-primary" id="profile-save">保存</button>
      </div>
      <div class="modal-tip" id="profile-tip"></div>
    </div>
  </div>

  <!-- 账号编辑弹层（账号管理） -->
  <div class="modal-mask" id="account-modal" style="display:none">
    <div class="modal-card">
      <div class="modal-title" id="account-modal-title">编辑账号</div>
      <div class="modal-field"><label>名字</label><input id="acct-name" placeholder="账号名"></div>
      <div class="modal-field"><label>头像</label>
        <div class="profile-avatar-pick" id="acct-avatar-pick"></div>
        <div class="upload-pick">
          <button type="button" class="btn-plain" id="acct-avatar-upload-btn">＋ 本地上传头像</button>
          <input type="file" id="acct-avatar-file" accept="image/*" style="display:none">
        </div>
      </div>
      <div class="modal-field"><label>朋友圈封面</label>
        <div class="upload-pick">
          <button type="button" class="btn-plain" id="acct-cover-upload-btn">＋ 本地上传封面</button>
          <input type="file" id="acct-cover-file" accept="image/*" style="display:none">
          <img id="acct-cover-preview" class="upload-preview upload-preview-cover" style="display:none">
        </div>
      </div>
      <div class="modal-field"><label>个性签名</label><input id="acct-sig" placeholder="个性签名"></div>
      <div class="modal-field"><label>人设描述（AI 帮你发朋友圈/写评论时参考的「你」的设定）</label>
        <textarea id="acct-desc" rows="3" placeholder="例如：我是刚入高专的新生，性格有点别扭但嘴硬心软，喜欢吐槽身边人，尤其看不惯五条老师…"></textarea>
      </div>
      <div class="modal-field"><label>关联角色与关系（和哪些角色是什么关系）</label>
        <div class="acct-relations" id="acct-relations"></div>
      </div>
      <div class="modal-field"><label>世界书 / 我的设定（可挂多个世界书，像酒馆本体那样逐个勾选条目）</label>
        <div class="wb-pick">
          <button type="button" class="btn-plain" id="acct-wb-add">＋ 挂载世界书</button>
          <button type="button" class="btn-plain" id="acct-wb-clear" style="display:none">全部移除</button>
        </div>
        <div class="wb-mounted" id="acct-wb-mounted"></div>
        <textarea id="acct-wb" rows="3" placeholder="自动由挂载的世界书生成，也可手写补充：例如 我是五条悟的女友…"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-plain" id="acct-cancel">取消</button>
        <button class="btn-primary" id="acct-save">保存</button>
      </div>
      <div class="modal-tip" id="acct-tip"></div>
    </div>
  </div>

  <!-- 分享到私信弹层 -->
  <div class="modal-mask" id="share-modal" style="display:none">
    <div class="modal-card">
      <div class="modal-title">分享到私信</div>
      <div class="modal-field">
        <label>分享给谁</label>
        <select id="share-char"></select>
      </div>
      <div class="modal-field">
        <label>附带的话（可选）</label>
        <input id="share-note" placeholder="例如：快看这个！">
      </div>
      <div class="modal-actions">
        <button class="btn-plain" id="share-cancel">取消</button>
        <button class="btn-primary" id="share-ok">分享</button>
      </div>
      <div class="modal-tip" id="share-tip"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- 选择关联角色弹层 -->
  <div class="modal-mask" id="role-pick-modal" style="display:none">
    <div class="modal-card modal-card-tall">
      <div class="modal-title">添加关联角色</div>
      <div class="rp-search">
        <input id="rp-search" placeholder="搜索角色名…">
        <select id="rp-tag"><option value="">全部分组</option></select>
      </div>
      <div class="rp-list" id="rp-list"></div>
      <div class="modal-actions">
        <button class="btn-plain" id="rp-cancel">完成</button>
      </div>
    </div>
  </div>

  <!-- 世界书条目勾选弹层 -->
  <div class="modal-mask" id="wb-entries-modal" style="display:none">
    <div class="modal-card modal-card-tall">
      <div class="modal-title">选择世界书条目<span id="wb-entries-name" style="font-weight:400;font-size:13px;color:#999"></span></div>
      <div class="wb-entries-hint">勾选要启用并注入为「我的设定」的条目（其余不生效）</div>
      <div class="wb-entries-list" id="wb-entries-list"></div>
      <div class="modal-actions">
        <button class="btn-plain" id="wb-entries-cancel">取消</button>
        <button class="btn-primary" id="wb-entries-ok">载入勾选条目</button>
      </div>
    </div>
  </div>

  <!-- 世界书挂载弹层（多选） -->
  <div class="modal-mask" id="wb-pick-modal" style="display:none">
    <div class="modal-card modal-card-tall">
      <div class="modal-title">挂载世界书</div>
      <div class="wb-entries-hint">勾选要挂载到当前账号的世界书（可多选）；挂载后可逐个勾选要启用的条目</div>
      <div class="wb-entries-list" id="wb-pick-list"></div>
      <div class="modal-actions">
        <button class="btn-plain" id="wb-pick-cancel">取消</button>
        <button class="btn-primary" id="wb-pick-ok">确定挂载</button>
      </div>
    </div>
  </div>

  <!-- 同意新朋友时选关系弹层 -->
  <div class="modal-mask" id="friend-rel-modal" style="display:none">
    <div class="modal-card">
      <div class="modal-title">添加「<span id="fr-name"></span>」为好友</div>
      <div class="modal-field"><label>TA 与你的关系</label>
        <select id="fr-relation"></select>
      </div>
      <div class="modal-field"><label>备注（可选，可写补充设定）</label>
        <input id="fr-note" placeholder="例如：从小一起长大 / 现在在追我">
      </div>
      <div class="modal-actions">
        <button class="btn-plain" id="fr-cancel">取消</button>
        <button class="btn-primary" id="fr-ok">同意添加</button>
      </div>
      <div class="modal-tip" id="fr-tip"></div>
    </div>
  </div>

  <!-- AI 写公众号推文弹层 -->
  <div class="modal-mask" id="article-modal" style="display:none">
    <div class="modal-card">
      <div class="modal-title">🤖 AI 写公众号推文</div>
      <div class="modal-field">
        <label>本期主题 / 灵感（比如：新宿甜品店探店、涩谷夜生活指南、五条家新任家主的八卦…）</label>
        <textarea id="art-hint" rows="2" placeholder="例如：新宿甜品店探店攻略"></textarea>
      </div>
      <div class="modal-field">
        <label>公众号名称（AI 生成后可修改）</label>
        <input id="art-author" placeholder="点击「✨ 生成」后自动填写">
      </div>
      <div class="modal-field">
        <label>AI 生成的标题（可修改）</label>
        <input id="art-title" placeholder="点击「✨ 生成」后自动填写">
      </div>
      <div class="modal-field">
        <label>正文（可修改）</label>
        <textarea id="art-body" rows="6" placeholder="点击「✨ 生成」后自动填写"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-plain" id="art-cancel">取消</button>
        <button class="btn-plain" id="art-gen">✨ 生成</button>
        <button class="btn-primary" id="art-publish">📤 发布</button>
      </div>
      <div class="modal-tip" id="art-tip"></div>
    </div>
  </div>
